services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER:     saas
      POSTGRES_PASSWORD: saas_dev
      POSTGRES_DB:       saas_dev
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saas -d saas_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Uncomment to run backend in Docker instead of locally
  # backend:
  #   build: .
  #   env_file: .env
  #   ports: ["3000:3000"]
  #   depends_on:
  #     postgres: { condition: service_healthy }
  #     redis:    { condition: service_healthy }

volumes:
  postgres_data:
